[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextgpt"
version = "1.0.0"
description = "ContextGPT - Multi-source AI summarization and question-answering platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ContextGPT Team" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "alembic",
    "__pycache__"
]
